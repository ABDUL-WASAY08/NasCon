<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline — NEXUS</title>
    <style>
      :root {
        --bg: #0a0b09;
        --surface: #14180f;
        --line: rgba(230, 240, 220, 0.16);
        --text: #e9ede2;
        --muted: #97a291;
        --accent: #c2f04a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.55 "IBM Plex Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        text-align: center;
      }
      .panel {
        max-width: 420px;
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--surface);
        padding: 40px 28px;
      }
      .pulse {
        width: 12px; height: 12px; border-radius: 999px;
        background: var(--accent);
        margin: 0 auto 20px;
        box-shadow: 0 0 0 0 rgba(194, 240, 74, 0.55);
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        70% { box-shadow: 0 0 0 16px rgba(194, 240, 74, 0); }
        100% { box-shadow: 0 0 0 0 rgba(194, 240, 74, 0); }
      }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
      h1 { font-size: 24px; margin: 0 0 8px; letter-spacing: -0.02em; }
      p { color: var(--muted); margin: 0 0 24px; }
      button {
        font: 600 15px/1 "IBM Plex Sans", system-ui, sans-serif;
        color: #0a0b09;
        background: var(--accent);
        border: 0;
        border-radius: 999px;
        padding: 14px 24px;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      small { display: block; margin-top: 20px; color: var(--muted); opacity: 0.8; }
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="pulse" aria-hidden="true"></div>
      <h1>You're offline</h1>
      <p>NEXUS keeps the console shell ready. Live bookings, chat and reports need a connection.</p>
      <button type="button" onclick="location.reload()">Retry connection</button>
      <small>Queued actions sync automatically when you're back online.</small>
    </main>
  </body>
</html>
